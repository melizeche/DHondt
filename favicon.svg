<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reparto de bancas">
  <title>Calculadora D'Hondt</title>
  <!-- Tres barras decrecientes: el reparto de bancas entre listas. Los colores
       son los de la paleta validada, que se distinguen en fondo claro y oscuro. -->
  <rect x="4"  y="7"  width="6" height="21" rx="2" fill="#e34948"/>
  <rect x="13" y="13" width="6" height="15" rx="2" fill="#2a78d6"/>
  <rect x="22" y="19" width="6" height="9"  rx="2" fill="#1baf7a"/>
</svg>
